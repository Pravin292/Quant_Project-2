[project]
name = "quant-project-2"
version = "0.1.0"
description = "TCS DCF valuation engine and API"
requires-python = ">=3.12"
# Vercel installs from this list (it prefers pyproject.toml over requirements.txt).
# Keep it identical to requirements.txt.
dependencies = [
    "numpy==2.5.5",
    "openpyxl==3.1.5",
    "pydantic==2.14.4",
    "fastapi==0.165.0",
    "pyyaml==6.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "api", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length is handled by black

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
