name: Refresh data snapshot

on:
  schedule:
    - cron: "30 12 * * *" # 18:00 IST, after the Indian market closes
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/refresh-snapshot.yml"] # also runs once whenever this workflow is edited

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/refresh_snapshot.py
      - name: Check the new data before publishing it
        run: pytest -q
      - name: Commit and push (Vercel redeploys from main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "chore: refresh data snapshot $(date -u +%F)"
            git push
          fi
